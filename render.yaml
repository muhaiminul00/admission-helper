# Render Blueprint (Milestone 17, Phase 3; cron services removed in
# Milestone 17.1) - Infrastructure as Code for this project's Render
# deployment: one web service and one managed PostgreSQL database.
# Applying this file (via the Render dashboard's "New Blueprint
# Instance", pointed at this repository) creates/updates both of the
# above from git - manual dashboard configuration should only ever be
# needed for actual secret *values* (Phase 5), never for which
# services exist.
#
# Milestone 17.1: Render's Free plan does not support `type: cron`
# services ("plan free not valid for service type cron"). The five
# reminder Scheduled Jobs that were previously defined here have been
# removed so the Blueprint validates and applies on Free. This does
# NOT change any reminder logic, command, or trigger condition - the
# five `send_*` management commands (reminders/management/commands/)
# are untouched and fully idempotent; they simply have no scheduler
# invoking them yet on this plan. Reminder scheduling on Render Free
# is deferred to a follow-up milestone (see docs/Deployment.md,
# "Reminder Scheduler" section, for the options being considered -
# e.g. a paid plan, or an external scheduler hitting a management
# endpoint). The original cron schedule derivation reasoning is kept
# below for whenever scheduling is reintroduced.
#
# Schema note: written against Render's documented Blueprint spec as
# of this milestone. Render's dashboard validates render.yaml on
# apply and will flag any field it doesn't recognize - if it does,
# see docs/Deployment.md's "Applying render.yaml" section before
# assuming the file itself is wrong.

envVarGroups:
  - name: admission-helper-shared
    envVars:
      # generateValue: true - Render creates a real random secret on
      # first apply; never a value this file (or any commit) contains.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # sync: false - must be entered once in the Render dashboard;
      # never invented here, never committed. See Phase 5's checklist
      # in docs/Deployment.md.
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Milestone 17.1: Render Free has no Shell and no One-Off Jobs
      # access (both are paid-tier-only), so `python manage.py
      # createsuperuser` cannot be run interactively against the
      # deployed instance. `core/management/commands/
      # ensure_superuser.py` (invoked from startCommand below) reads
      # these three and idempotently creates/updates that one
      # superuser on every deploy. Optional: leave unset and the
      # command silently no-ops - only set these if you have no other
      # way to reach the Django admin/staff pages.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Matches this project's default (admission_helper/settings.py) -
      # only change this if the admission cycle being tracked is ever
      # in a different timezone. If you do, every cron `schedule`
      # below must be recalculated (they're derived from Asia/Dhaka's
      # fixed UTC+6 offset - see the comment on each job).
      - key: TIME_ZONE
        value: Asia/Dhaka
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: admission-helper-db
    databaseName: admission_helper
    user: admission_helper
    plan: free

services:
  # --- Web service --------------------------------------------------
  - type: web
    name: admission-helper
    env: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      npm --prefix theme/static_src ci &&
      npm --prefix theme/static_src run build &&
      python manage.py collectstatic --noinput
    # Milestone 17.1: preDeployCommand is also a paid-tier-only Render
    # feature ("pre-deploy command is not supported for free tier
    # services") - migration is folded into startCommand instead, so
    # it still runs before gunicorn starts on every deploy/restart.
    # Django migrations are safe to re-run (no-op if already applied),
    # so this is equivalent in effect, just triggered from a different
    # lifecycle hook.
    #
    # ensure_superuser and import_csv are here for the same reason:
    # Render Free has no Shell/One-Off Jobs to run them interactively
    # after deploy (see the env var comments above and
    # docs/Deployment.md). Both are safe to run on every restart -
    # ensure_superuser no-ops if its env vars are unset, and
    # import_csv is idempotent (update_or_create keyed on each model's
    # natural identity), so re-running it never duplicates data.
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py ensure_superuser &&
      python manage.py import_csv &&
      gunicorn admission_helper.wsgi
      --bind 0.0.0.0:$PORT
      --workers ${WEB_CONCURRENCY:-2}
      --timeout 30
      --access-logfile -
      --error-logfile -
    healthCheckPath: /health/
    envVars:
      - fromGroup: admission-helper-shared
      - key: DATABASE_URL
        fromDatabase:
          name: admission-helper-db
          property: connectionString

  # --- Scheduled Jobs: OMITTED on Render Free (Milestone 17.1) -------
  # Render's Free plan rejects `type: cron` services outright ("plan
  # free not valid for service type cron") - a Blueprint that includes
  # them cannot be applied at all on this plan, so they are removed
  # here rather than merely disabled. The five reminder commands
  # themselves (reminders/management/commands/send_*.py) are
  # unchanged and still fully functional when run manually (Render
  # Free has no Shell/One-Off Jobs access, so "manually" means adding
  # them to startCommand the same way ensure_superuser/import_csv are
  # above, or running them from a local machine against
  # DATABASE_URL) or by whatever scheduler is introduced in a
  # follow-up milestone.
  #
  # Kept for when scheduling is reintroduced (a paid Render plan, or
  # an external scheduler): each job would run one of the five
  # `send_*` commands, needs no Tailwind build/collectstatic (reminder
  # emails are inline-styled HTML - see templates/emails/), and its
  # schedule is derived from the command's actual trigger logic
  # (reminders/services/*.py), not guessed:
  #
  # - send_daily_agenda: hourly (0 * * * *) - each user has their own
  #   configurable delivery time (NotificationPreference.
  #   daily_agenda_time), so only an hourly cadence catches every
  #   possible setting reliably.
  # - send_weekly_overview / send_exam_reminders /
  #   send_revision_reminders / send_weekly_progress: once daily at
  #   03:00 UTC (0 3 * * *). Not midnight UTC, specifically because
  #   send_exam_reminders' "exam day morning" case additionally
  #   requires the current wall-clock time to be past
  #   EXAM_DAY_MORNING_TIME (08:00, reminders/services/exams.py).
  #   "03:00 UTC" = "09:00 Asia/Dhaka" - safely past that 08:00 gate,
  #   and since a +6:00 offset never crosses a UTC calendar-day
  #   boundary at this hour, "today" in Dhaka always matches "today"
  #   in UTC at this run time, so no day-of-week/date logic needs to
  #   think about timezones at the scheduler layer - each command's
  #   own generator (already timezone-aware via Django's TIME_ZONE)
  #   decides what's actually due.
  #
  # Every command remains idempotent (ReminderLog's unique constraint)
  # and safe to run manually in the meantime - see docs/Deployment.md,
  # "Reminder Scheduler" section.

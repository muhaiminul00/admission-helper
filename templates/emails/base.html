{% comment %} Email base layout (Milestone 15, Phase 8). Table-based
   with inline styles only - the widest-compatible approach across
   email clients, many of which strip <style> blocks or ignore
   external/Tailwind classes entirely. Not the app's own base.html:
   emails are a separate, self-contained rendering surface. {% endcomment %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block subject %}Admission Helper{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;">
<tr>
<td style="background-color:#0f172a;padding:20px 24px;">
<span style="color:#ffffff;font-size:18px;font-weight:600;">Admission Helper</span>
</td>
</tr>
<tr>
<td style="padding:24px;font-size:15px;line-height:1.5;">
{% block content %}{% endblock %}
</td>
</tr>
<tr>
<td style="padding:16px 24px;background-color:#f9fafb;border-top:1px solid #e5e7eb;">
<p style="margin:0;font-size:12px;color:#6b7280;">
You're receiving this because you have this reminder enabled in your notification preferences. You can change what you receive, and when, from your account settings at any time.
</p>
</td>
</tr>
</table>
</td></tr>
</table>
</body>
</html>

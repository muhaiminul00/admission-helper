{% extends "base.html" %}

{% block title %}Reset Email Sent - Admission Helper{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto text-center py-12">
    <h1 class="text-xl font-semibold mb-2">Check your email</h1>
    <p class="text-gray-500 mb-6">
        If an account exists with that email address, we've sent instructions
        for resetting your password.
    </p>
    <a href="{% url 'login' %}" class="text-blue-600 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">&larr; Back to Login</a>
</div>
{% endblock %}

{% extends "base.html" %}
{% load ui_tags %}

{% block title %}Change Password - Admission Helper{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto">
    <h1 class="text-2xl font-semibold mb-6 text-ink">Change Password</h1>
    <div class="bg-surface border border-line rounded-lg p-6">
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                {% for field in form %}
                    {% include "components/form_field.html" %}
                {% endfor %}
            </div>
            <button type="submit" class="{% button_classes 'primary' 'lg' %} mt-6 w-full">
                Change Password
            </button>
        </form>
    </div>
</div>
{% endblock %}

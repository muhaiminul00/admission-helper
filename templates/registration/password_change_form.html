{% extends "base.html" %}

{% block title %}Change Password - Admission Helper{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto">
    <h1 class="text-2xl font-semibold mb-6 text-gray-900">Change Password</h1>
    <div class="bg-white border border-gray-200 rounded-lg p-6">
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                {% for field in form %}
                    {% include "components/form_field.html" %}
                {% endfor %}
            </div>
            <button type="submit" class="mt-6 w-full bg-slate-900 text-white rounded py-2 hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 focus-visible:ring-offset-1">
                Change Password
            </button>
        </form>
    </div>
</div>
{% endblock %}

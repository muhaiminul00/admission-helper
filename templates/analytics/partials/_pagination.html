{% load routine_tags %}
{% if page_obj.paginator.num_pages > 1 %}
    <nav aria-label="Pagination" class="flex gap-2 mt-3 text-sm">
        {% if page_obj.has_previous %}
            <a class="px-2 py-1 border border-line rounded hover:bg-surface-quiet focus:outline-none focus-visible:ring-2 focus-visible:ring-accent"
               href="{% querystring_page page_obj.previous_page_number %}"
               hx-get="{% querystring_page page_obj.previous_page_number %}"
               hx-target="{{ target }}" hx-swap="innerHTML" hx-push-url="true"
               hx-indicator="#page-indicator">Previous</a>
        {% endif %}
        <span class="px-2 py-1" aria-current="page">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a class="px-2 py-1 border border-line rounded hover:bg-surface-quiet focus:outline-none focus-visible:ring-2 focus-visible:ring-accent"
               href="{% querystring_page page_obj.next_page_number %}"
               hx-get="{% querystring_page page_obj.next_page_number %}"
               hx-target="{{ target }}" hx-swap="innerHTML" hx-push-url="true"
               hx-indicator="#page-indicator">Next</a>
        {% endif %}
    </nav>
{% endif %}

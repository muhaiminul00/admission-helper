{% comment %} Component: select_field — a labeled <select> for filter forms.
   Context vars: name (required), label (required), options (required
   - iterable of (value, label) 2-tuples, first one usually being
   ("", "All")), selected (optional - the currently-selected value). {% endcomment %}
<div>
    <label class="block text-sm text-gray-600 dark:text-gray-400 mb-1" for="{{ name }}">{{ label }}</label>
    <select name="{{ name }}" id="{{ name }}"
            class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:border-slate-600 dark:bg-slate-800 dark:text-gray-100">
        {% for value, opt_label in options %}
            <option value="{{ value }}" {% if selected == value %}selected{% endif %}>{{ opt_label }}</option>
        {% endfor %}
    </select>
</div>

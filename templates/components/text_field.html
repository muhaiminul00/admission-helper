{% comment %} Component: text_field — a labeled text <input> for filter forms
   (e.g. the Lecture Analytics search box). Context vars: name
   (required), label (required), value (optional current value),
   placeholder (optional). {% endcomment %}
<div>
    <label class="block text-sm text-ink-muted mb-1" for="{{ name }}">{{ label }}</label>
    <input type="text" name="{{ name }}" id="{{ name }}" value="{{ value|default:'' }}"
           placeholder="{{ placeholder|default:'' }}"
           class="border border-line rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-accent focus:border-accent">
</div>

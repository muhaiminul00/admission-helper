{% include "exams/partials/_timeline_body.html" %}
{% if has_more_next %}
    <div id="next-sentinel"
         hx-get="{% url 'exam-timeline-window' %}?direction=next&after={{ newest_date }}&subject={{ selected_subject }}&status={{ selected_status }}"
         hx-trigger="revealed"
         hx-swap="outerHTML"
         hx-target="this"
         class="text-center text-xs text-gray-400 py-3">Loading upcoming exams&hellip;</div>
{% endif %}

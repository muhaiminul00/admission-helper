{% extends "base.html" %}
{% load ui_tags %}

{% block title %}Register - Admission Helper{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-4">
    <h1 class="text-2xl font-semibold mb-6 text-ink">Create an Account</h1>
    <div class="bg-surface border border-line rounded-lg p-6">
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                {% for field in form %}
                    {% include "components/form_field.html" %}
                {% endfor %}
            </div>
            <button type="submit" class="{% button_classes 'primary' 'lg' %} mt-6 w-full">
                Register
            </button>
        </form>
        <p class="text-sm text-ink-muted mt-4">
            Already have an account? <a href="{% url 'login' %}" class="text-accent hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-accent rounded">Login</a>
        </p>
    </div>
</div>
{% endblock %}
